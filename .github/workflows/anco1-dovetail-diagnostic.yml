name: Anco1 - scoped diagnostic for Dovetail PO
on:
  push:
    branches:
      - investigate/order-006-dovetail-26-20261028

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run minimally scoped SELECT-only status trace
        shell: pwsh
        env:
          ANCO1_SQL_SERVER: ${{ secrets.ANCO1_SQL_SERVER }}
          ANCO1_SQL_DATABASE: ${{ secrets.ANCO1_SQL_DATABASE }}
          ANCO1_SQL_USER: ${{ secrets.ANCO1_SQL_USER }}
          ANCO1_SQL_PASSWORD: ${{ secrets.ANCO1_SQL_PASSWORD }}
        run: |
          ./scripts/anco1_sql_readonly.ps1 -QueryFile "sql/inspect-order-006-dovetail-26.sql" -OutputDirectory "sql-results"
          Get-Content "sql-results/result.csv" -Encoding UTF8
