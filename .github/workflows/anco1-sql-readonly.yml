name: Anco1 - remote SQL read-only inspection

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/anco1-sql-readonly.yml'
  workflow_dispatch:
    inputs:
      query:
        description: 'Approved query file'
        required: true
        type: choice
        options:
          - sql/inspect-packaging-schema.sql
          - sql/inspect-packaging-review.sql
          - sql/inspect-product-export-preview.sql

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Execute approved read-only query
        shell: pwsh
        env:
          ANCO1_SQL_SERVER: ${{ secrets.ANCO1_SQL_SERVER }}
          ANCO1_SQL_DATABASE: ${{ secrets.ANCO1_SQL_DATABASE }}
          ANCO1_SQL_USER: ${{ secrets.ANCO1_SQL_USER }}
          ANCO1_SQL_PASSWORD: ${{ secrets.ANCO1_SQL_PASSWORD }}
        run: ./scripts/anco1_sql_readonly.ps1 -QueryFile "sql/inspect-product-export-preview.sql" -OutputDirectory "sql-results"
      - uses: actions/upload-artifact@v4
        with:
          name: anco1-sql-inspection
          path: sql-results/result.csv
          retention-days: 1
