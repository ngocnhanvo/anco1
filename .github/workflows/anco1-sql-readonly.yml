name: Anco1 - VPS SQL read-only inspection

on:
  workflow_dispatch:
    inputs:
      query:
        description: 'Approved query file'
        required: true
        type: choice
        options:
          - sql/inspect-packaging-schema.sql

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, windows, anco1-sql]
    timeout-minutes: 5
    environment: anco1-sql-readonly
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Execute approved read-only query
        shell: pwsh
        env:
          ANCO1_SQL_SERVER: ${{ secrets.ANCO1_SQL_SERVER }}
          ANCO1_SQL_DATABASE: ${{ secrets.ANCO1_SQL_DATABASE }}
          ANCO1_SQL_USER: ${{ secrets.ANCO1_SQL_USER }}
          ANCO1_SQL_PASSWORD: ${{ secrets.ANCO1_SQL_PASSWORD }}
        run: ./scripts/anco1_sql_readonly.ps1 -QueryFile "${{ inputs.query }}" -OutputDirectory "sql-results"
      - uses: actions/upload-artifact@v4
        with:
          name: anco1-sql-inspection
          path: sql-results/result.csv
          retention-days: 1
