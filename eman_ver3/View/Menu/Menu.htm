<script type="text/javascript">
    function dem_Records_menu() {
        var a_menu = $('.menu_td_menuchinh tr td table tr td div table tr td a');
        $(a_menu).removeAttr('style');
        $(a_menu).css('color', 'red');
        var val_final = "";
        $(a_menu).each(function (index, val) {
            val_final += $(this).attr('name');
            if (index < $(a_menu).length - 1) {
                val_final += ",";
            }
        });
        if (val_final != null & val_final != "") {
            click_loadtrangchu();
            $('.menu_td_menuchinh tr td table tr td div table tr td a').removeAttr('style');
            $('.menu_td_menuchinh tr td table tr td div table tr td a').css('color', 'black');
            loadgrid_at = false;
            //$.post('Controller/PublicFunction/CountDocument.ashx?oper=countCV',
            //{ ma_menu: val_final }, function (result) {
            //    result = result.split('(##)');
            //    $(a_menu).each(function (index, val) {
            //        loadgiatri_demCV($(this).attr('id'), result[index]);
            //    });
            //});
        }
    }

    $('.menu_td_menuchinh table').empty();
    $('.menu_td_menuchinh table').append('<tr><td class="loading" height="50px"></td></tr>');

    $.ajax({
        type: "GET",
        url: "Controller/JqGridModify/JQGridMD_00_MNZModify.ashx?oper=loadMenu",
        success: function (msg) {
            $('.menu_td_menuchinh table').empty();
            $('.menu_td_menuchinh table').append(msg);
            dem_Records_menu();

            if (isLinkTransfer) {
                let menu = searchParams.get('menu');
                $('#a_' + menu).click();
                $('#tr_' + menu).parent().parent().prev().click();
            }
        }
    });

    function loadMenucon(e, d) {
		var this_sel = $('#tr_' + e + ' > td > table');
        if ($(this_sel).hasClass('menu_btndanhan')) {
			$('#div_' + e + ' > a').css('text-shadow','none');
			$(this_sel).fadeOut( 200, function(){
				$('#div_' + e).css('padding', '0px 0 3px 0');
				$(this).css('display', 'none');
				$(this).removeClass('menu_btndanhan');
				//$(this).parent().removeAttr('style');
			});
        }
        else {
			$('#div_' + e).css('padding', '4px 0 3px 0');
			$('#div_' + e + ' > a').css('text-shadow','1px 1px 1px #F16B6B');
			
			$(this_sel).addClass('menu_btndanhan');
			$(this_sel).fadeIn( 200, function(){
				$(this).removeAttr('style');
			});
        }
    }


    function loadContent(e, d, c, q) {
        $('.menu_td_menuchinh tr td table tr td').removeClass('menu_btndanhan');

        //xoa gach duoi tat ca va them vao td vừa nhấn
        $('.menu_td_menuchinh tr td table tr td div table tr td span').removeAttr('style');
        //$('.menu_td_menuchinh tr td table tr td div table tr td span').css('color', 'rgba(0, 0, 0, 0.8)');
        $('.menu_td_menuchinh tr td table tr td div table tr td span').css('font-weight', 'normal');
        $('#td_' + e + ' div table tr td span').css('color', 'rgb(223, 66, 66)');

        $('#td_' + e).addClass('menu_btndanhan');

        //load content cua menu nay voi url nay
        $('#input_urlmenu').val(d);
        $('#input_idmenu').val(e);

        //lam moi gia tri ten cho su kien url of clicking events
        $('#input_tenmenu0').val(q);
        $('#input_tenmenu1').val(c);
        $('.cl_td_urlmenu > div').empty();

        $('#input_tenmodule1').val("");
        $('#input_tenmodule2').val("");
        // gán giá trị cho sự kiện trở về trang trước
        $('#input_trovetrangtruoc').val($('#input_trovetrangtruoc').val() + '/' + 'td_' + e);
        document.title = "eMan-" + c;
        //let searchParams = new URLSearchParams(window.location.search);

        //if (searchParams.has('menu')) {
        //    let uri = window.location.toString();
        //    if (uri.indexOf("?") > 0) {
        //        var clean_uri = uri.substring(0, uri.indexOf("?"));
        //        window.history.replaceState({}, document.title, clean_uri);
        //    }
        //}

        if (btnDongMenuTuDong) {
            $('div.displayMenuConfig').click();
        }

        loadPage('Menu/Content/Content.aspx');
       
    }

    function overmouse_menu_lv0(e) {
        $('#' + e).css('font-weight', '700');
    }
    function outmouse_menu_lv0(e) {
        $('#' + e).removeAttr('style');
    }

    function overmouse_menu_lv1(e) {
        if (!$('#' + e).hasClass('menu_btndanhan')) {
            $('#' + e + ' div table tr td span').css('color', 'rgb(223, 66, 66)');
        }
    }
    function outmouse_menu_lv1(e) {
        if (!$('#' + e).hasClass('menu_btndanhan')) {
            $('#' + e + ' div table tr td span').removeAttr('style');
        }
    }

    $('#a_user').append(ma_tk);
    
    click_refreshPage();

    let margin_img = 30 + Number($('#a_user').width()) - 18;
    $('#Img4').css('margin', '0px 3px 0 ' + margin_img + 'px');

    checkNewReport();
</script>
